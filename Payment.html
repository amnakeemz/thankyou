<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#03050a"
>

<title>Payment Confirmation</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #03050a;

    color: white;

    overflow: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(0, 140, 255, .13),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(130, 50, 255, .14),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(0, 255, 190, .07),
            transparent 40%
        ),

        #03050a;

    z-index: -10;
}


/* =========================================================
   GLOW
========================================================= */

.glow {
    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    filter: blur(100px);

    opacity: .35;

    animation:
        floatingGlow
        12s
        ease-in-out
        infinite
        alternate;
}

.glow.one {

    background: #0066ff;

    top: -200px;

    left: -150px;
}

.glow.two {

    background: #7928ff;

    bottom: -250px;

    right: -150px;

    animation-delay: -5s;
}


@keyframes floatingGlow {

    0% {
        transform:
            translate(0, 0)
            scale(1);
    }

    50% {
        transform:
            translate(120px, 80px)
            scale(1.15);
    }

    100% {
        transform:
            translate(-50px, -80px)
            scale(.9);
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;
}

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.5);

    box-shadow:
        0 0 12px
        rgba(255,255,255,.5);

    animation:
        particleFloat
        linear
        infinite;
}


@keyframes particleFloat {

    from {

        transform:
            translateY(110vh);

        opacity: 0;
    }

    15% {

        opacity: 1;
    }

    85% {

        opacity: 1;
    }

    to {

        transform:
            translateY(-10vh);

        opacity: 0;
    }

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card {

    width:
        min(440px, 100%);

    min-height: 500px;

    position: relative;

    overflow: hidden;

    padding: 42px 32px;

    border-radius: 28px;

    background:
        rgba(12,17,29,.70);

    border:
        1px solid
        rgba(255,255,255,.10);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.55),

        inset 0 1px 0
        rgba(255,255,255,.06);

    transition:
        opacity .6s ease,
        transform .6s ease;
}


/* =========================================================
   GLASS REFLECTION
========================================================= */

.card::before {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    top: -180px;
    right: -100px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.025);

    filter: blur(5px);

    pointer-events: none;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    width: 78px;
    height: 78px;

    margin:
        0 auto 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 23px;

    background:

        linear-gradient(
            135deg,
            rgba(0,150,255,.25),
            rgba(120,60,255,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:

        0 0 35px
        rgba(0,140,255,.18),

        inset 0 0 20px
        rgba(255,255,255,.04);

    font-size: 32px;

    position: relative;

    z-index: 2;

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;
}


@keyframes logoFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-6px);
    }

}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.small-title {

    text-align: center;

    font-size: 11px;

    letter-spacing: 4px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 12px;

    text-transform: uppercase;
}


.title {

    text-align: center;

    font-size: 29px;

    font-weight: 700;

    letter-spacing: -.5px;

    margin-bottom: 12px;
}


.subtitle {

    text-align: center;

    color:
        rgba(255,255,255,.55);

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 35px;
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.button {

    width: 100%;

    height: 56px;

    border: none;

    border-radius: 15px;

    color: white;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1.8px;

    cursor: pointer;

    background:

        linear-gradient(
            135deg,
            #087cff,
            #6737ff
        );

    box-shadow:

        0 10px 35px
        rgba(45,90,255,.28);

    transition:

        transform .25s ease,

        box-shadow .25s ease,

        filter .25s ease;
}


.button:hover {

    transform:
        translateY(-3px);

    filter:
        brightness(1.12);

    box-shadow:

        0 15px 45px
        rgba(45,90,255,.45);
}


.button:active {

    transform:
        scale(.96);
}


/* =========================================================
   BUTTON GLOW
========================================================= */

.button-wrap {

    position: relative;
}


.button-wrap::before {

    content: "";

    position: absolute;

    inset: -4px;

    border-radius: 18px;

    background:
        linear-gradient(
            90deg,
            #087cff,
            #6737ff,
            #087cff
        );

    filter:
        blur(15px);

    opacity: .18;

    z-index: -1;

    animation:
        buttonGlow
        3s
        ease-in-out
        infinite;
}


@keyframes buttonGlow {

    0%,
    100% {
        opacity: .12;
    }

    50% {
        opacity: .35;
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align: center;

    margin-top: 30px;

    font-size: 10px;

    color:
        rgba(255,255,255,.28);

    letter-spacing: 1px;
}


/* =========================================================
   PAYMENT SCREEN
========================================================= */

#paymentScreen {

    display: none;

    opacity: 0;

    transform:
        translateY(25px)
        scale(.97);
}


.payment-card {

    text-align: center;
}


/* =========================================================
   SUCCESS ICON
========================================================= */

.success-icon {

    width: 95px;
    height: 95px;

    margin:
        0 auto 28px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(0,255,180,.25);

    background:

        radial-gradient(
            circle,
            rgba(0,255,180,.15),
            rgba(0,255,180,.025)
        );

    box-shadow:

        0 0 50px
        rgba(0,255,180,.15);

    animation:
        successPulse
        2.5s
        ease-in-out
        infinite;
}


.success-icon span {

    font-size: 42px;

    color:
        #56ffc7;

    animation:
        checkAppear
        .7s
        ease;
}


@keyframes successPulse {

    0%,
    100% {

        transform:
            scale(1);

        box-shadow:
            0 0 30px
            rgba(0,255,180,.10);
    }

    50% {

        transform:
            scale(1.06);

        box-shadow:
            0 0 65px
            rgba(0,255,180,.22);
    }

}


@keyframes checkAppear {

    0% {

        transform:
            scale(0);

        opacity: 0;
    }

    70% {

        transform:
            scale(1.2);
    }

    100% {

        transform:
            scale(1);

        opacity: 1;
    }

}


/* =========================================================
   LANGUAGE
========================================================= */

.language {

    font-size: 11px;

    letter-spacing: 3px;

    color:
        #65ffc9;

    text-transform: uppercase;

    margin-bottom: 18px;

    opacity: 1;

    transition:
        opacity .45s ease;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    min-height: 100px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: 26px;

    font-weight: 600;

    line-height: 1.45;

    letter-spacing: -.3px;

    transition:

        opacity .45s ease,

        transform .45s ease;
}


.message.fade {

    opacity: 0;

    transform:
        translateY(14px)
        scale(.97);
}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    width: 65px;

    height: 1px;

    margin:
        25px auto;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );
}


/* =========================================================
   PAYMENT STATUS
========================================================= */

.payment-status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding:
        9px 15px;

    border-radius: 50px;

    background:
        rgba(0,255,180,.06);

    border:
        1px solid
        rgba(0,255,180,.12);

    color:
        rgba(255,255,255,.60);

    font-size: 11px;

    letter-spacing: 1px;
}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #55ffc6;

    box-shadow:
        0 0 12px
        #55ffc6;

    animation:
        blink
        1.5s
        infinite;
}


@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .35;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .card {

        padding:
            35px 24px;

        border-radius: 24px;

        min-height: 470px;
    }

    .title {

        font-size: 25px;
    }

    .message {

        font-size: 22px;
    }

    .success-icon {

        width: 82px;
        height: 82px;
    }

    .success-icon span {

        font-size: 36px;
    }

}


/* =========================================================
   SCREEN TRANSITION
========================================================= */

.screen-enter {

    animation:
        screenEnter
        .7s
        ease forwards;
}


@keyframes screenEnter {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}

</style>

</head>


<body>


<!-- =======================================================
     ANIMATED BACKGROUND
======================================================== -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>


    <div class="particles">

        <span
            class="particle"
            style="
                left:5%;
                animation-duration:12s;
                animation-delay:0s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:12%;
                animation-duration:18s;
                animation-delay:2s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:20%;
                animation-duration:14s;
                animation-delay:5s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:30%;
                animation-duration:20s;
                animation-delay:1s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:42%;
                animation-duration:16s;
                animation-delay:4s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:55%;
                animation-duration:19s;
                animation-delay:7s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:66%;
                animation-duration:13s;
                animation-delay:3s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:75%;
                animation-duration:17s;
                animation-delay:6s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:84%;
                animation-duration:15s;
                animation-delay:2s;
            "
        ></span>

        <span
            class="particle"
            style="
                left:94%;
                animation-duration:21s;
                animation-delay:8s;
            "
        ></span>

    </div>

</div>



<!-- =======================================================
     APPLICATION
======================================================== -->

<div class="app">


    <!-- ===================================================
         MAIN PAGE
    ==================================================== -->

    <div
        class="card"
        id="mainScreen"
    >

        <div class="logo">

            ✓

        </div>


        <div class="small-title">

            PAYMENT PORTAL

        </div>


        <div class="title">

            Payment Confirmation

        </div>


        <div class="subtitle">

            Thank you for using our payment service.
            Click below to continue.

        </div>


        <div class="button-wrap">

            <button
                class="button"
                onclick="openPayment()"
            >

                PLEASE CLICK HERE

            </button>

        </div>


        <div class="footer">

            SECURE PAYMENT PORTAL • 2026

        </div>

    </div>



    <!-- ===================================================
         PAYMENT SUCCESS PAGE
    ==================================================== -->

    <div
        class="card payment-card"
        id="paymentScreen"
    >

        <div class="success-icon">

            <span>

                ✓

            </span>

        </div>


        <div
            class="language"
            id="language"
        >

            ENGLISH

        </div>


        <div
            class="message"
            id="message"
        >

            Thank you for your payment.

        </div>


        <div class="divider"></div>


        <div class="payment-status">

            <span class="status-dot"></span>

            PAYMENT SUCCESSFUL

        </div>


        <div class="footer">

            YOUR PAYMENT HAS BEEN RECEIVED

        </div>

    </div>


</div>



<script>

/* =========================================================
   OPEN PAYMENT SCREEN
========================================================= */

function openPayment() {

    const mainScreen =
        document.getElementById(
            "mainScreen"
        );

    const paymentScreen =
        document.getElementById(
            "paymentScreen"
        );


    /*
       Fade out main page
    */

    mainScreen.style.opacity = "0";

    mainScreen.style.transform =
        "translateY(-25px) scale(.97)";


    setTimeout(() => {

        /*
           Hide main page
        */

        mainScreen.style.display =
            "none";


        /*
           Show payment page
        */

        paymentScreen.style.display =
            "block";


        /*
           Start animation
        */

        setTimeout(() => {

            paymentScreen.classList.add(
                "screen-enter"
            );

        }, 30);


        /*
           Start languages
        */

        startLanguageAnimation();

    }, 600);

}


/* =========================================================
   LANGUAGES
========================================================= */

const languages = [

    {
        name: "ENGLISH",
        text:
            "Thank you for your payment."
    },

    {
        name: "MALAY",
        text:
            "Terima kasih atas pembayaran anda."
    },

    {
        name: "한국어",
        text:
            "결제해 주셔서 감사합니다."
    },

    {
        name: "日本語",
        text:
            "お支払いありがとうございます。"
    },

    {
        name: "中文",
        text:
            "感谢您的付款。"
    },

    {
        name: "हिन्दी",
        text:
            "आपके भुगतान के लिए धन्यवाद।"
    },

    {
        name: "FRANÇAIS",
        text:
            "Merci pour votre paiement."
    },

    {
        name: "DEUTSCH",
        text:
            "Vielen Dank für Ihre Zahlung."
    },

    {
        name: "РУССКИЙ",
        text:
            "Спасибо за вашу оплату."
    }

];


let currentLanguage = 0;

let languageTimer = null;


/* =========================================================
   START LANGUAGE ANIMATION
========================================================= */

function startLanguageAnimation() {

    currentLanguage = 0;

    updateLanguage();


    /*
       Change every 3 seconds
    */

    languageTimer =
        setInterval(() => {

            currentLanguage++;

            if (
                currentLanguage >=
                languages.length
            ) {

                currentLanguage = 0;

            }

            changeLanguage();

        }, 3000);

}


/* =========================================================
   INITIAL LANGUAGE
========================================================= */

function updateLanguage() {

    const language =
        document.getElementById(
            "language"
        );

    const message =
        document.getElementById(
            "message"
        );


    language.textContent =
        languages[
            currentLanguage
        ].name;


    message.textContent =
        languages[
            currentLanguage
        ].text;

}


/* =========================================================
   LANGUAGE TRANSITION
========================================================= */

function changeLanguage() {

    const language =
        document.getElementById(
            "language"
        );

    const message =
        document.getElementById(
            "message"
        );


    /*
       Fade out
    */

    language.style.opacity = "0";

    message.classList.add(
        "fade"
    );


    setTimeout(() => {

        /*
           Change text
        */

        language.textContent =
            languages[
                currentLanguage
            ].name;


        message.textContent =
            languages[
                currentLanguage
            ].text;


        /*
           Fade in
        */

        language.style.opacity = "1";

        message.classList.remove(
            "fade"
        );

    }, 450);

}

</script>


</body>

</html>
